<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="capa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe0ff"/>
      <stop offset="0.45" stop-color="#3fb6f0"/>
      <stop offset="1" stop-color="#1c78c9"/>
    </linearGradient>
    <linearGradient id="ponta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc4f2"/>
      <stop offset="1" stop-color="#1767b0"/>
    </linearGradient>
    <linearGradient id="haste" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="0.5" stop-color="#b7bfca"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
    <linearGradient id="cabo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#d9581c"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e6ec"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
  </defs>

  <!-- haste de metal: sai da ponta do rolo, desce e volta até o cabo -->
  <path d="M196 86 H214 Q224 86 224 96 V128 Q224 138 214 138 H150 Q140 138 140 148 V170"
        fill="none" stroke="#5d6672" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 86 H214 Q224 86 224 96 V128 Q224 138 214 138 H150 Q140 138 140 148 V170"
        fill="none" stroke="url(#haste)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- rolo com tinta azul -->
  <rect x="28" y="52" width="176" height="68" rx="34" fill="url(#capa)"/>
  <ellipse cx="194" cy="86" rx="14" ry="34" fill="url(#ponta)"/>
  <rect x="44" y="60" width="128" height="12" rx="6" fill="#ffffff" opacity="0.45"/>
  <circle cx="58" cy="104" r="5" fill="#1767b0" opacity="0.35"/>
  <circle cx="96" cy="108" r="4" fill="#1767b0" opacity="0.3"/>
  <circle cx="140" cy="103" r="5" fill="#1767b0" opacity="0.3"/>

  <!-- anel de metal e cabo -->
  <rect x="127" y="164" width="26" height="14" rx="5" fill="url(#anel)"/>
  <rect x="124" y="174" width="32" height="66" rx="16" fill="url(#cabo)"/>
  <rect x="131" y="182" width="7" height="46" rx="3.5" fill="#ffffff" opacity="0.4"/>
</svg>
